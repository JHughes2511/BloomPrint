<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</helmet>
<div data-screen-label="Link to Staff" style="width:390px;height:852px;border-radius:46px;overflow:hidden;background:var(--canvas,#F5F0E8);display:flex;flex-direction:column;font-family:'Hanken Grotesk',sans-serif;color:var(--ink,#15252F);">

  <div style="flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 26px 2px;">
    <span style="font-weight:700;font-size:16px;color:var(--ink,#15252F);">9:44</span>
    <div style="display:flex;align-items:center;gap:8px;color:var(--ink,#15252F);">
      <div style="display:flex;align-items:flex-end;gap:2px;height:11px;"><span style="width:3px;height:5px;background:currentColor;border-radius:1px;opacity:.5;"></span><span style="width:3px;height:7px;background:currentColor;border-radius:1px;opacity:.7;"></span><span style="width:3px;height:9px;background:currentColor;border-radius:1px;opacity:.85;"></span><span style="width:3px;height:11px;background:currentColor;border-radius:1px;"></span></div>
      <i data-lucide="wifi" width="16" height="16"></i>
      <div style="width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;padding:1.5px;opacity:.9;"><div style="width:55%;height:100%;background:currentColor;border-radius:1px;"></div></div>
    </div>
  </div>

  <div style="flex:0 0 auto;display:flex;align-items:center;gap:13px;padding:6px 24px 8px;"><i data-lucide="chevron-left" width="24" height="24" style="color:var(--ink,#15252F);"></i><div style="font-weight:800;font-size:23px;letter-spacing:-.01em;color:var(--ink,#15252F);">Link to Staff</div></div>

  <div style="flex:1 1 auto;overflow:hidden;padding:10px 24px 0;">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:8px;">
      <div style="width:78px;height:78px;border-radius:22px;background:var(--accent-soft,rgba(31,111,155,.1));color:var(--tile-icon,#1F6F9B);display:flex;align-items:center;justify-content:center;"><i data-lucide="link" width="36" height="36"></i></div>
      <div style="font-weight:800;font-size:21px;color:var(--ink,#15252F);margin-top:16px;">Connect with your coach</div>
      <div style="font-size:14px;color:var(--muted,#857C6E);margin-top:8px;line-height:1.5;max-width:280px;">Enter the code your coach shared, or scan their QR to link your portal to the team.</div>
    </div>

    <div style="font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label,#1F6F9B);margin:30px 0 11px;">Enter Link Code</div>
    <div style="display:flex;gap:9px;">
      <div style="flex:1;height:60px;border-radius:14px;background:var(--card,#fff);border:1.5px solid var(--accent,#1F6F9B);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--ink,#15252F);">B</div>
      <div style="flex:1;height:60px;border-radius:14px;background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--ink,#15252F);">7</div>
      <div style="flex:1;height:60px;border-radius:14px;background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--muted-2,#ABA192);">·</div>
      <div style="flex:1;height:60px;border-radius:14px;background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--muted-2,#ABA192);">·</div>
      <div style="flex:1;height:60px;border-radius:14px;background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--muted-2,#ABA192);">·</div>
      <div style="flex:1;height:60px;border-radius:14px;background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--muted-2,#ABA192);">·</div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;margin:24px 0;"><div style="flex:1;height:1px;background:var(--divider,#EAE2D5);"></div><span style="font-size:12px;color:var(--muted-2,#ABA192);font-weight:700;letter-spacing:.08em;">OR</span><div style="flex:1;height:1px;background:var(--divider,#EAE2D5);"></div></div>

    <div style="border:1px solid var(--cta2-border,#D9D2C7);border-radius:15px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--cta2-text,#16242E);font-weight:800;font-size:15.5px;"><i data-lucide="qr-code" width="20" height="20"></i> Scan QR Code</div>

    <div style="margin-top:14px;background:var(--cta-bg,#1F6F9B);color:var(--cta-text,#fff);border-radius:15px;padding:17px;text-align:center;font-weight:800;font-size:16.5px;">Link Account</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:852}}">
class Component extends DCLogic {
  componentDidMount(){ this._draw(); }
  componentDidUpdate(){ this._draw(); }
  _draw(){ const go=(n)=>{ if(window.lucide&&window.lucide.createIcons){try{window.lucide.createIcons();}catch(e){}} else if(n<40){setTimeout(()=>go(n+1),120);} }; go(0); }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
