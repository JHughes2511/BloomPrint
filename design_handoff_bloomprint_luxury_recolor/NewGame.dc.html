<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</helmet>
<div data-screen-label="New Game" style="width:390px;height:852px;border-radius:46px;overflow:hidden;background:var(--canvas,#F5F0E8);display:flex;flex-direction:column;font-family:'Hanken Grotesk',sans-serif;color:var(--ink,#15252F);">

  <div style="flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 26px 2px;">
    <span style="font-weight:700;font-size:16px;color:var(--ink,#15252F);">11:32</span>
    <div style="display:flex;align-items:center;gap:8px;color:var(--ink,#15252F);">
      <div style="display:flex;align-items:flex-end;gap:2px;height:11px;"><span style="width:3px;height:5px;background:currentColor;border-radius:1px;opacity:.5;"></span><span style="width:3px;height:7px;background:currentColor;border-radius:1px;opacity:.7;"></span><span style="width:3px;height:9px;background:currentColor;border-radius:1px;opacity:.85;"></span><span style="width:3px;height:11px;background:currentColor;border-radius:1px;"></span></div>
      <i data-lucide="wifi" width="16" height="16"></i>
      <div style="width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;padding:1.5px;opacity:.9;"><div style="width:55%;height:100%;background:currentColor;border-radius:1px;"></div></div>
    </div>
  </div>

  <div style="flex:0 0 auto;display:flex;align-items:center;gap:13px;padding:6px 24px 16px;"><i data-lucide="chevron-left" width="24" height="24" style="color:var(--ink,#15252F);"></i><div style="font-weight:800;font-size:25px;letter-spacing:-.01em;color:var(--ink,#15252F);">New Game</div></div>

  <div style="flex:1 1 auto;overflow:hidden;padding:6px 24px 0;">
    <div style="font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label,#1F6F9B);margin-bottom:11px;">Select Your Team</div>
    <div style="background:var(--card,#fff);border:1.5px solid var(--accent,#1F6F9B);backdrop-filter:var(--card-blur,none);-webkit-backdrop-filter:var(--card-blur,none);border-radius:15px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;"><div style="font-weight:800;font-size:17px;color:var(--ink,#15252F);">Team Monaco</div><div style="width:24px;height:24px;border-radius:50%;background:var(--accent,#1F6F9B);color:#fff;display:flex;align-items:center;justify-content:center;"><i data-lucide="check" width="15" height="15"></i></div></div>
    <div style="background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);backdrop-filter:var(--card-blur,none);-webkit-backdrop-filter:var(--card-blur,none);border-radius:15px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;"><div style="font-weight:700;font-size:17px;color:var(--ink,#15252F);">Team Prada</div><div style="width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line,#E1D9CA);"></div></div>

    <div style="font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label,#1F6F9B);margin:22px 0 9px;">Opponent</div>
    <div style="background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);border-radius:13px;padding:15px 17px;color:var(--muted-2,#ABA192);font-size:15.5px;">Enter opponent name…</div>

    <div style="display:flex;gap:13px;margin-top:18px;">
      <div style="flex:1;"><div style="font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label,#1F6F9B);margin-bottom:9px;">Date</div><div style="background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);border-radius:13px;padding:15px 17px;color:var(--ink,#15252F);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;">Jun 27 <i data-lucide="calendar" width="17" height="17" style="color:var(--muted,#857C6E);"></i></div></div>
      <div style="flex:1;"><div style="font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label,#1F6F9B);margin-bottom:9px;">Type</div><div style="background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);border-radius:13px;padding:15px 17px;color:var(--ink,#15252F);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;">Regular <i data-lucide="chevron-down" width="17" height="17" style="color:var(--muted,#857C6E);"></i></div></div>
    </div>

    <div style="font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label,#1F6F9B);margin:22px 0 11px;">Tracking Mode</div>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;padding:16px;border-radius:14px;background:var(--accent-soft,rgba(31,111,155,.1));border:1.5px solid var(--accent,#1F6F9B);text-align:center;"><i data-lucide="activity" width="22" height="22" style="color:var(--accent,#1F6F9B);"></i><div style="font-weight:800;font-size:14.5px;color:var(--ink,#15252F);margin-top:7px;">Live Track</div><div style="font-size:11.5px;color:var(--muted,#857C6E);margin-top:2px;">Tap events in real time</div></div>
      <div style="flex:1;padding:16px;border-radius:14px;border:1px solid var(--line,#E1D9CA);text-align:center;"><i data-lucide="edit-3" width="22" height="22" style="color:var(--muted,#857C6E);"></i><div style="font-weight:700;font-size:14.5px;color:var(--ink,#15252F);margin-top:7px;">Post-Game</div><div style="font-size:11.5px;color:var(--muted,#857C6E);margin-top:2px;">Enter stats after</div></div>
    </div>

    <div style="margin-top:24px;background:var(--cta-bg,#1F6F9B);color:var(--cta-text,#fff);border-radius:15px;padding:17px;text-align:center;font-weight:800;font-size:16.5px;display:flex;gap:9px;align-items:center;justify-content:center;"><i data-lucide="play" width="19" height="19"></i> Start Game</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:852}}">
class Component extends DCLogic {
  componentDidMount(){ this._draw(); }
  componentDidUpdate(){ this._draw(); }
  _draw(){ const go=(n)=>{ if(window.lucide&&window.lucide.createIcons){try{window.lucide.createIcons();}catch(e){}} else if(n<40){setTimeout(()=>go(n+1),120);} }; go(0); }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
