<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</helmet>
<div data-screen-label="Roster" style="width:390px;height:852px;border-radius:46px;overflow:hidden;background:var(--canvas,#F5F0E8);display:flex;flex-direction:column;font-family:'Hanken Grotesk',sans-serif;color:var(--ink,#15252F);">

  <div style="flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 26px 2px;">
    <span style="font-weight:700;font-size:16px;color:var(--ink,#15252F);">11:26</span>
    <div style="display:flex;align-items:center;gap:8px;color:var(--ink,#15252F);">
      <div style="display:flex;align-items:flex-end;gap:2px;height:11px;"><span style="width:3px;height:5px;background:currentColor;border-radius:1px;opacity:.5;"></span><span style="width:3px;height:7px;background:currentColor;border-radius:1px;opacity:.7;"></span><span style="width:3px;height:9px;background:currentColor;border-radius:1px;opacity:.85;"></span><span style="width:3px;height:11px;background:currentColor;border-radius:1px;"></span></div>
      <i data-lucide="wifi" width="16" height="16"></i>
      <div style="width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;padding:1.5px;opacity:.9;"><div style="width:55%;height:100%;background:currentColor;border-radius:1px;"></div></div>
    </div>
  </div>

  <div style="flex:1 1 auto;overflow:hidden;padding:10px 22px 0;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:4px;">
      <div><div style="font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--ink,#15252F);">Roster</div><div style="font-size:13.5px;color:var(--muted,#857C6E);margin-top:5px;">All Teams · 4 players</div></div>
      <div style="display:flex;align-items:center;gap:9px;">
        <div style="display:flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid var(--cta2-border,#D9D2C7);border-radius:999px;color:var(--cta2-text,#16242E);font-size:12.5px;font-weight:700;"><i data-lucide="cloud-upload" width="15" height="15"></i> Import</div>
        <div style="width:40px;height:40px;border-radius:50%;background:var(--cta-bg,#1F6F9B);color:var(--cta-text,#fff);display:flex;align-items:center;justify-content:center;"><i data-lucide="plus" width="20" height="20"></i></div>
      </div>
    </div>

    <div style="display:flex;gap:9px;margin:22px 0 18px;">
      <div style="padding:10px 19px;border-radius:999px;background:var(--cta-bg,#1F6F9B);color:var(--cta-text,#fff);font-weight:800;font-size:13.5px;">All</div>
      <div style="padding:10px 19px;border-radius:999px;border:1px solid var(--line,#E1D9CA);color:var(--ink,#15252F);font-weight:700;font-size:13.5px;">Team Monaco</div>
      <div style="padding:10px 19px;border-radius:999px;border:1px solid var(--line,#E1D9CA);color:var(--ink,#15252F);font-weight:700;font-size:13.5px;">Team Prada</div>
    </div>

    <div style="background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);backdrop-filter:var(--card-blur,none);-webkit-backdrop-filter:var(--card-blur,none);border-radius:18px;padding:18px;margin-bottom:13px;"><div style="font-weight:800;font-size:19px;color:var(--ink,#15252F);">Test player</div><div style="font-size:13.5px;color:var(--muted,#857C6E);margin-top:4px;">SF · New York Knicks</div></div>
    <div style="background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);backdrop-filter:var(--card-blur,none);-webkit-backdrop-filter:var(--card-blur,none);border-radius:18px;padding:18px;margin-bottom:13px;"><div style="font-weight:800;font-size:19px;color:var(--ink,#15252F);">Test Player 2</div><div style="font-size:13.5px;color:var(--muted,#857C6E);margin-top:4px;">SF · New York Knicks</div></div>
    <div style="background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);backdrop-filter:var(--card-blur,none);-webkit-backdrop-filter:var(--card-blur,none);border-radius:18px;padding:18px;margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:800;font-size:19px;color:var(--ink,#15252F);">Wyatt Seale</div><div style="font-size:13.5px;color:var(--muted,#857C6E);margin-top:4px;">C · Black Hills State University</div></div><div style="width:56px;height:56px;border-radius:50%;border:3px solid var(--accent,#1F6F9B);display:flex;align-items:center;justify-content:center;color:var(--accent,#1F6F9B);font-weight:800;font-size:17px;flex:0 0 auto;">6.1</div></div>
    <div style="background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);backdrop-filter:var(--card-blur,none);-webkit-backdrop-filter:var(--card-blur,none);border-radius:18px;padding:18px;"><div style="font-weight:800;font-size:19px;color:var(--ink,#15252F);">Shay</div><div style="font-size:13.5px;color:var(--muted,#857C6E);margin-top:4px;">PG · New York Knicks</div></div>
  </div>

  <div style="flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;padding:12px 12px 22px;border-top:1px solid var(--divider,#EAE2D5);background:var(--navbar,transparent);">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted-2,#ABA192);"><i data-lucide="home" width="22" height="22"></i><span style="font-size:11px;font-weight:600;">Home</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted-2,#ABA192);"><i data-lucide="users" width="22" height="22"></i><span style="font-size:11px;font-weight:600;">Team Eval</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted-2,#ABA192);"><i data-lucide="bar-chart-3" width="22" height="22"></i><span style="font-size:11px;font-weight:600;">Team Grade</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--accent,#1F6F9B);"><i data-lucide="list" width="22" height="22"></i><span style="font-size:11px;font-weight:700;">Roster</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted-2,#ABA192);"><i data-lucide="clock" width="22" height="22"></i><span style="font-size:11px;font-weight:600;">Recent</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:852}}">
class Component extends DCLogic {
  componentDidMount(){ this._draw(); }
  componentDidUpdate(){ this._draw(); }
  _draw(){ const go=(n)=>{ if(window.lucide&&window.lucide.createIcons){try{window.lucide.createIcons();}catch(e){}} else if(n<40){setTimeout(()=>go(n+1),120);} }; go(0); }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
