<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</helmet>
<div data-screen-label="Who Are You (Role Select)" style="width:390px;height:852px;border-radius:46px;overflow:hidden;background:var(--canvas,#F5F0E8);display:flex;flex-direction:column;font-family:'Hanken Grotesk',sans-serif;color:var(--ink,#15252F);">

  <div style="flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 26px 2px;">
    <span style="font-weight:700;font-size:16px;color:var(--ink,#15252F);">11:33</span>
    <div style="display:flex;align-items:center;gap:8px;color:var(--ink,#15252F);">
      <div style="display:flex;align-items:flex-end;gap:2px;height:11px;"><span style="width:3px;height:5px;background:currentColor;border-radius:1px;opacity:.5;"></span><span style="width:3px;height:7px;background:currentColor;border-radius:1px;opacity:.7;"></span><span style="width:3px;height:9px;background:currentColor;border-radius:1px;opacity:.85;"></span><span style="width:3px;height:11px;background:currentColor;border-radius:1px;"></span></div>
      <i data-lucide="wifi" width="16" height="16"></i>
      <div style="width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;padding:1.5px;opacity:.9;"><div style="width:55%;height:100%;background:currentColor;border-radius:1px;"></div></div>
    </div>
  </div>

  <div style="flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:0 30px;">
    <div style="font-weight:800;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--label,#1F6F9B);text-align:center;">BloomPrint</div>
    <div style="font-weight:800;font-size:34px;letter-spacing:-.02em;color:var(--ink,#15252F);text-align:center;margin-top:14px;line-height:1.1;">Who are you?</div>
    <div style="font-size:15px;color:var(--muted,#857C6E);text-align:center;margin-top:10px;line-height:1.5;">Choose how you'll use BloomPrint. You can switch later in settings.</div>

    <div style="margin-top:40px;display:flex;flex-direction:column;gap:15px;">
      <div style="background:var(--card,#fff);border:1.5px solid var(--accent,#1F6F9B);backdrop-filter:var(--card-blur,none);-webkit-backdrop-filter:var(--card-blur,none);border-radius:22px;padding:22px;display:flex;align-items:center;gap:16px;">
        <div style="width:58px;height:58px;border-radius:17px;background:var(--accent-soft,rgba(31,111,155,.1));color:var(--tile-icon,#1F6F9B);display:flex;align-items:center;justify-content:center;flex:0 0 auto;"><i data-lucide="clipboard-list" width="28" height="28"></i></div>
        <div style="flex:1;"><div style="font-weight:800;font-size:20px;color:var(--ink,#15252F);">Coach</div><div style="font-size:13.5px;color:var(--muted,#857C6E);margin-top:3px;line-height:1.45;">Build reports, track games, evaluate your roster</div></div>
        <i data-lucide="chevron-right" width="22" height="22" style="color:var(--accent,#1F6F9B);"></i>
      </div>
      <div style="background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);backdrop-filter:var(--card-blur,none);-webkit-backdrop-filter:var(--card-blur,none);border-radius:22px;padding:22px;display:flex;align-items:center;gap:16px;">
        <div style="width:58px;height:58px;border-radius:17px;background:var(--brown-soft,rgba(138,98,74,.12));color:var(--brown,#8A624A);display:flex;align-items:center;justify-content:center;flex:0 0 auto;"><i data-lucide="user" width="28" height="28"></i></div>
        <div style="flex:1;"><div style="font-weight:800;font-size:20px;color:var(--ink,#15252F);">Player</div><div style="font-size:13.5px;color:var(--muted,#857C6E);margin-top:3px;line-height:1.45;">Receive reports, follow training, track your growth</div></div>
        <i data-lucide="chevron-right" width="22" height="22" style="color:var(--muted-2,#ABA192);"></i>
      </div>
    </div>

    <div style="text-align:center;margin-top:34px;font-size:14px;color:var(--muted,#857C6E);">Already have an account? <span style="color:var(--label,#1F6F9B);font-weight:800;">Sign in</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:852}}">
class Component extends DCLogic {
  componentDidMount(){ this._draw(); }
  componentDidUpdate(){ this._draw(); }
  _draw(){ const go=(n)=>{ if(window.lucide&&window.lucide.createIcons){try{window.lucide.createIcons();}catch(e){}} else if(n<40){setTimeout(()=>go(n+1),120);} }; go(0); }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
