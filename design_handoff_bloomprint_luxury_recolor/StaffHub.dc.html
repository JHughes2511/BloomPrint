<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</helmet>
<div data-screen-label="Staff Hub" style="width:390px;height:852px;border-radius:46px;overflow:hidden;background:var(--canvas,#F5F0E8);display:flex;flex-direction:column;font-family:'Hanken Grotesk',sans-serif;color:var(--ink,#15252F);">

  <div style="flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 26px 2px;">
    <span style="font-weight:700;font-size:16px;color:var(--ink,#15252F);">4:45</span>
    <div style="display:flex;align-items:center;gap:8px;color:var(--ink,#15252F);">
      <div style="display:flex;align-items:flex-end;gap:2px;height:11px;"><span style="width:3px;height:5px;background:currentColor;border-radius:1px;opacity:.5;"></span><span style="width:3px;height:7px;background:currentColor;border-radius:1px;opacity:.7;"></span><span style="width:3px;height:9px;background:currentColor;border-radius:1px;opacity:.85;"></span><span style="width:3px;height:11px;background:currentColor;border-radius:1px;"></span></div>
      <i data-lucide="wifi" width="16" height="16"></i>
      <div style="width:24px;height:12px;border:1.5px solid currentColor;border-radius:3px;padding:1.5px;opacity:.9;"><div style="width:55%;height:100%;background:currentColor;border-radius:1px;"></div></div>
    </div>
  </div>

  <div style="flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:6px 24px 16px;">
    <i data-lucide="chevron-left" width="24" height="24" style="color:var(--ink,#15252F);"></i>
    <div style="font-weight:800;font-size:28px;letter-spacing:-.01em;color:var(--ink,#15252F);">Staff Hub</div>
  </div>

  <div style="flex:1 1 auto;overflow:hidden;padding:0 22px;">
    <div style="display:flex;background:var(--card,#fff);border:1px solid var(--card-border,#E7DFD0);backdrop-filter:var(--card-blur,none);-webkit-backdrop-filter:var(--card-blur,none);border-radius:16px;padding:6px;gap:4px;">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:11px;background:var(--cta-bg,#1F6F9B);color:var(--cta-text,#fff);font-weight:800;font-size:14.5px;"><i data-lucide="mail" width="17" height="17"></i> Inbox</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:11px;color:var(--muted,#857C6E);font-weight:700;font-size:14px;">🏀 Team Games</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:11px;color:var(--muted,#857C6E);font-weight:700;font-size:14px;"><i data-lucide="users" width="17" height="17"></i> My Teams</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:150px;">
      <div style="width:88px;height:88px;border-radius:24px;border:2px solid var(--line,#E1D9CA);display:flex;align-items:center;justify-content:center;color:var(--muted-2,#ABA192);"><i data-lucide="mail" width="42" height="42"></i></div>
      <div style="font-size:16.5px;color:var(--muted,#857C6E);margin-top:22px;font-weight:500;">No reports shared with you yet.</div>
    </div>
  </div>

  <div style="flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;padding:12px 12px 22px;border-top:1px solid var(--divider,#EAE2D5);background:var(--navbar,transparent);">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--accent,#1F6F9B);"><i data-lucide="home" width="22" height="22"></i><span style="font-size:11px;font-weight:700;">Home</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted-2,#ABA192);"><i data-lucide="users" width="22" height="22"></i><span style="font-size:11px;font-weight:600;">Team Eval</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted-2,#ABA192);"><i data-lucide="bar-chart-3" width="22" height="22"></i><span style="font-size:11px;font-weight:600;">Team Grade</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted-2,#ABA192);"><i data-lucide="list" width="22" height="22"></i><span style="font-size:11px;font-weight:600;">Roster</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted-2,#ABA192);"><i data-lucide="clock" width="22" height="22"></i><span style="font-size:11px;font-weight:600;">Recent</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:852}}">
class Component extends DCLogic {
  componentDidMount(){ this._draw(); }
  componentDidUpdate(){ this._draw(); }
  _draw(){ const go=(n)=>{ if(window.lucide&&window.lucide.createIcons){try{window.lucide.createIcons();}catch(e){}} else if(n<40){setTimeout(()=>go(n+1),120);} }; go(0); }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
