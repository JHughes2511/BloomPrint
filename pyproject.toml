[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bloomprint-video-vision"
version = "0.1.0"
description = "MCP server providing video and vision analysis tools for Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiofiles>=23.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "google-auth>=2.28.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
# Local Whisper, for transcribing without a Deepgram key. Optional because it
# pulls in torch — gigabytes of wheels that frequently fail to build on a new
# Python, to run a model that needs a GPU to be usable. Deepgram is the default
# path and needs none of it.
#     pip install -e ".[local-whisper]"
local-whisper = [
    "openai-whisper @ git+https://github.com/openai/whisper.git",
]

[project.scripts]
video-vision-mcp = "video_vision.server:main"
bloomprint-api   = "api.main:start"

[tool.hatch.build.targets.wheel]
packages = ["video_vision", "api"]

[tool.hatch.metadata]
allow-direct-references = true
